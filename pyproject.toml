[build-system]
# our own backend (scripts/backend.py): it writes scripts/builder.py's ninja
# plan from trimkit.toml and runs it, with clang on every platform. Every
# source it compiles, nanobind's included, is vendored and hash-pinned there
requires = ["ninja==1.13.2"]
build-backend = "backend"
backend-path = ["scripts"]

[project]
name = "trimkit"
version = "0.2.1"
description = "Thin stable-ABI numpy bindings to mature geometry libraries: rays and boxes, collision, triangulation, convex decomposition, UV atlases, simplification, draco and SVG paths."
readme = "README.md"
requires-python = ">=3.12"
# what a wheel contains: ours, then every upstream compiled in (`check` derives it from trimkit.toml)
license = "MIT AND Apache-2.0 AND (Apache-2.0 OR MIT) AND (Apache-2.0 WITH LLVM-exception OR BSL-1.0) AND BSD-3-Clause AND ISC AND (MIT OR Apache-2.0 OR BSL-1.0) AND MPL-2.0"
license-files = ["LICENSE", "vendor/*/LICENSE*", "vendor/*/COPYING*"]
authors = [{ name = "Michael Dawson-Haggerty", email = "mikedh@kerfed.com" }]
dependencies = ["numpy>=2"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Typing :: Typed",
]

[project.urls]
homepage = "https://github.com/trimesh/trimkit"

[dependency-groups]
# Every tool and dependency any build, test or check uses, hash-locked in
# uv.lock (`uv run scripts lock`). Wheel builds install `build` and `test`,
# and their audit `audit`, from it by hash, through requirements.txt and
# audit.txt exported into their source tree for cibuildwheel, whose
# containers have pip but not uv.
test = ["pytest", "hypothesis", "lark", "svg.path"]
# the build requirement, pinned exactly like build-system.requires so builds
# without isolation get the same version, by hash
build = ["ninja==1.13.2"]
# what scripts/check_wheel.py runs on every wheel, here and in cibuildwheel
audit = ["abi3audit", "twine"]
# static analysis and license tooling, installed into the trixie image
lint = ["ruff", "zizmor"]
# the Python-boundary fuzzer for `uv run scripts atheris`
fuzz = ["atheris"]
# the wheel builder for `uv run scripts wheel`, locally and in CI
wheel = ["cibuildwheel>=4.3,<5"]

[tool.uv]
# `uv run scripts ...` only needs an interpreter: never build the package for it
package = false
# the one uv every machine and CI job uses (setup-uv reads this too)
required-version = "==0.13.7"
# a release must be a week old before a lock can pick it up, so a hijacked
# upload has time to be noticed and yanked before it reaches a build
exclude-newer = "7 days"

[tool.cibuildwheel]
# One abi3 wheel per platform: cibuildwheel builds it on 3.12 and then reuses it
# to run the tests on every later CPython, so a new CPython needs no new release.
# Nothing per-version: free-threaded Python builds the sdist until nanobind can
# reach abi3t without its split mode. `uv run scripts wheel` runs this, locally and in CI.
build = ["cp312-*", "cp313-*", "cp314-*", "cp315-*"]
# Every platform numpy publishes a wheel for: nothing else can pip install us
# without compiling numpy. `archs` is cibuildwheel's own `auto`: 64-bit, and x86 on Windows
skip = ["*_ppc64le", "*_s390x", "*_armv7l", "*_riscv64"]
archs = ["auto"]
# no build isolation: the build requirement (ninja) comes from
# requirements.txt, by hash, installed by `before-build` rather than resolved
# fresh from PyPI. uv makes every environment, with no pip in them: pip's
# environments need virtualenv.pyz, an anonymous GitHub download GitHub throttles
build-frontend = { name = "build[uv]", args = ["--no-isolation"] }
# the Linux images ship their own uv, not the 0.13.7 [tool.uv] requires, so no
# uv in a build reads that config: every install here is by hash anyway
environment = { UV_NO_CONFIG = "1" }
# profile-guided: train an instrumented build on the tests, then build with
# its profiles. pgo.py also installs requirements.txt by hash
before-build = "python scripts/pgo.py"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
# release wheels fail on any warning in our sources
config-settings = { strict = "true", pgo = "use" }
# the test dependencies by hash too, then the wheel under test
before-test = "uv pip install --require-hashes --no-deps -r {project}/requirements.txt"
# wall-clock bounds are the local gate's: a busy runner mustn't block a release on one
# (double quotes: cmd.exe, on Windows, doesn't know single ones)
test-command = 'pytest {project}/tests -q -m "not timing"'
# metadata, then check_wheel.py: abi3audit, licenses, naming and sizes, with
# both tools installed by hash rather than cibuildwheel's own abi3audit
audit-requires = ["--require-hashes", "--no-deps", "-r", "audit.txt"]
audit-command = ["twine check --strict {wheel}", "python scripts/check_wheel.py {wheel}"]

# clang and lld, which every build uses, from each Linux image's own packages
[[tool.cibuildwheel.overrides]]
select = "*-manylinux*"
before-all = "dnf install -y clang lld llvm"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = "apk add clang lld llvm compiler-rt"

# LLVM's Windows release has profile runtimes for its own machine alone, so
# the x64 runner can't link 32-bit training: built and tested all the same
[[tool.cibuildwheel.overrides]]
select = "*-win32"
before-build = "uv pip install --require-hashes --no-deps -r {project}/requirements.txt"
config-settings = { strict = "true" }

[tool.cibuildwheel.windows]
# nothing to bundle: the extension links its C and C++ runtimes in, and needs
# only Windows and python3.dll
repair-wheel-command = ""

[tool.cibuildwheel.macos]
# numpy's own oldest on arm64: an API newer than this is a compile error
# (and the base table's, which this one replaces)
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0", UV_NO_CONFIG = "1" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# no cache directory: tests run from a read-only source tree in the image
addopts = "-ra --strict-markers --strict-config -p no:cacheprovider"
# wall-clock measurements: everywhere but PGO training and the sanitizers,
# whose instrumented builds are slower and measure themselves, not the code
markers = [
    "timing: asserts a wall-clock bound or measures how long the GIL is held",
    "device: needs a Vulkan device computing in double precision, else skips (see tests/conftest.py)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 110
target-version = "py312"
# explicit, since .gitignore is only honored inside a git checkout
extend-exclude = ["build", "vendor", "wheelhouse", "dist", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S", "SIM", "PL", "RUF"]
ignore = [
    "S101", # assert is how pytest checks
    "S603", # subprocess with argument lists is the point of scripts/
]

[tool.ruff.lint.per-file-ignores]
# magic numbers, lazy imports and long functions in tests, benchmarks and scripts
"tests/*" = ["PLR2004", "PLC0415", "PLR0913"]
"tests/test_threads.py" = ["F821"] # `del scene` after the closures that use it
"tests/svg_reference.py" = ["PLR2004", "B023", "PLR0912", "PLR0915"] # closures run within their iteration
"bench/*" = ["PLR2004", "PLC0415", "PLR0912", "PLR0913", "PLR0915", "S607"] # `git` and `uv` from PATH
"scripts/*" = ["PLR0912", "PLR0913", "PLR0915", "PLC0415", "PLR2004"]
"fuzz/*" = ["PLR2004", "PLC0415", "PLR0912", "PLR0915"]
"examples/*" = ["PLR2004"]
