# collision and distance between meshes: coal's BVH traversal and GJK/EPA,
# only what our binding reaches. The one Boost.Math constant and Boost.Assert
# macro it uses are shims of ours in src/config/coal, with the headers its
# CMake would generate
[upstream.coal]
repo = "coal-library/coal"
ref = "devel"
commit = "83cdaa6addd580c11dadd2299476e6f08aece2f4"
tree_sha256 = "177a68706ab247cc3c0e0d30e39683071183a118841f84fdb966dcb55b1a24ff"
spdx = "BSD-3-Clause"
# src/distance/triangle_triangle.cpp defines a ShapeShapeDistancer specialization no header is named after
keep = ["LICENSE", "src/distance/triangle_triangle.cpp"]
requires = ["eigen"]
sources = ["vendor/coal/src/**/*.cpp"]
no_sanitize = { vptr = "convex support dispatches by casting a ConvexBase to empty derived tag types (SmallConvex, LargeConvex): a downcast to a type the object isn't, undefined but benign on every ABI, as the tags add no members or virtuals" }
include = ["vendor/coal/include", "vendor/coal/src", "vendor/coal/include/coal/third_party", "src/config/coal"]

[upstream.coal.patches]
"coal-bvh-bvh-performance.patch" = "0f53292b95269a8f7e128a393c1ed8deae2003d62d6eae7424f38d795f9aa025"
"coal-hierarchy-tree-array-leak.patch" = "4ec9a982489343d9661e765091b9f973ba462d6eac7b034fede4cd295bd98780"

# coal's linear algebra, header only: only the headers coal and our binding
# reach on some wheel target. MPL-2.0, which binds only its own files, kept
# unmodified and shipped as source in the sdist
[upstream.eigen]
host = "gitlab.com"
repo = "libeigen/eigen"
# pinned to a commit, so `update` leaves it: its master moves dozens of
# headers between releases, and only coal reads them. We only really should
# update this when eigen ships a major version, `ref` and `commit` together
ref = "f6db5ea201198eb747bd9e34f7a3d8dfc4da308e"
commit = "f6db5ea201198eb747bd9e34f7a3d8dfc4da308e"
tree_sha256 = "32d85596bef0f51f6483911663f0eb8798c01289b1e9f94310f7cc2527140e13"
spdx = "MPL-2.0"
copyright = "Copyright the Eigen authors"
keep = ["COPYING.MPL2", "COPYING.APACHE", "COPYING.BSD"]
include = ["vendor/eigen"]
system = "Eigen/Core"
system_directory = "eigen3"
distro = { debian = "libeigen3-dev", fedora = "eigen3-devel" }

[upstream.eigen.defines]
EIGEN_MPL2_ONLY = "refuse to compile any part of Eigen under a license other than MPL-2.0"
EIGEN_NO_CPU_CACHE_SYSFS = "no file read for cache sizes, which only size the blocking of large dynamic products we don't make: the extension opens nothing but its cgroup limits"

# nanobind, compiled from these sources into the one extension
# (src/nb_combined.cpp, its documented build without CMake), with its
# headers, its macOS list of the C API and the stub generator: whole, as its
# macros need a real Python to scan, and it is small
[upstream.nanobind]
repo = "wjakob/nanobind"
ref = "v3.1.0"
commit = "68480a9e6883bb1bf65e1925423321e2a89d07f9"
tree_sha256 = "1d17298c75ff02d56b7f5a2b35f86aad9e69d3b919da69168b752fabc1f93168"
spdx = "BSD-3-Clause"
keep = ["LICENSE", "cmake/darwin-ld-cpython.sym", "include", "src"]

# the hash map nanobind's runtime uses, at the submodule commit nanobind
# v3.1.0 pins as `ext/robin_map`
[upstream.robin_map]
repo = "Tessil/robin-map"
ref = "4ec1bf19c6a96125ea22062f38c2cf5b958e448e"
commit = "4ec1bf19c6a96125ea22062f38c2cf5b958e448e"
tree_sha256 = "1cd1a20397a4c42ed19541e0c12e9acd33afdeceb9e9e112b7cf0ea3cbfaf77a"
spdx = "MIT"
keep = ["LICENSE", "include"]
include = ["vendor/robin_map/include"]
system = "tsl/robin_map.h"
distro = { debian = "robin-map-dev", fedora = "robin-map-devel" }

[extension]
budget = 4_400_000
upstreams = ["nanobind", "robin_map"]

[part.bvh]
upstreams = ["tinybvh", "vulkan_headers"]
fuzz = ["bvh", "parallel", "vulkan"]

[part.earcut]
upstreams = ["earcut"]
fuzz = ["earcut"]

[part.vhacd]
upstreams = ["vhacd"]
fuzz = ["vhacd"]

[part.xatlas]
upstreams = ["xatlas"]
fuzz = ["xatlas"]

[part.draco]
upstreams = ["draco"]
fuzz = ["draco", "draco_roundtrip"]
# our binding only writes sequential buffers, but most exporters write edgebreaker
seeds = "draco_seeds"

[part.svg]
upstreams = ["fast_float", "dragonbox"]
fuzz = ["svgpath", "svgpath_format"]

[part.meshoptimizer]
upstreams = ["meshoptimizer"]
fuzz = ["meshoptimizer"]

[part.collision]
upstreams = ["coal", "eigen"]
fuzz = ["collision"]

# src/contour.hpp is ours, as src/svgpath.hpp is
[part.contour]
upstreams = []
fuzz = ["contour"]

