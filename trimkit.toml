[upstream.svgpath]
own = true
spdx = "MIT"
include = ["vendor/svgpath"]


[extension]
budget = 4_400_000
upstreams = ["nanobind", "robin_map"]

[part.bvh]
upstreams = ["tinybvh"]
fuzz = ["bvh", "parallel"]

[part.earcut]
upstreams = ["earcut"]
fuzz = ["earcut"]

[part.vhacd]
upstreams = ["vhacd"]
fuzz = ["vhacd"]

[part.xatlas]
upstreams = ["xatlas"]
fuzz = ["xatlas"]

[part.draco]
upstreams = ["draco"]
fuzz = ["draco", "draco_roundtrip"]
# our binding only writes sequential buffers, but most exporters write edgebreaker
seeds = "draco_seeds"

[part.svg]
upstreams = ["svgpath", "fast_float", "dragonbox"]
fuzz = ["svgpath", "svgpath_format"]

[part.meshoptimizer]
upstreams = ["meshoptimizer"]
fuzz = ["meshoptimizer"]

[part.collision]
upstreams = ["coal", "eigen"]
fuzz = ["collision"]

