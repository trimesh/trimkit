tree_sha256 = "2371ee6ac9f3d5baae897b7986e72c7e5d7c7eb90491cc7fa81c3c780c4c54ac"
spdx = "MIT"
keep = ["LICENSE"]
# the implementation unit is a two-line file of ours that defines
# TINYBVH_IMPLEMENTATION, compiled quietly like the header it includes
sources = ["src/tinybvh.cpp"]
include = ["vendor/tinybvh"]

[upstream.tinybvh.defines]
TINYBVH_NO_SIMD = "its x86 kernels need AVX2, which a portable wheel can't assume; one code path answers alike everywhere"
WATERTIGHT_TRITEST = "costs 2-7%, and rays at the vertices and edges of a closed mesh no longer escape it (12.8% did)"
NO_VOXEL_SUPPORT = "a feature we don't use"
NO_CUSTOM_GEOMETRY = "a feature we don't use"
NO_THREADED_BUILDS = "build on the calling thread: threaded builds gained 1-8% (1M faces 205 vs 207 ms, 2026-11-01) and overflowed musl's 128 KB thread stacks in BuildHQ (SIGSEGV), which no dlopen'ed module can raise"

[upstream.tinybvh.patches]
"tinybvh-flat-node-bins.patch" = "fede891c586822c339923c731d913c12500a76ae7a6d11d9c21b48c3ae999469"

