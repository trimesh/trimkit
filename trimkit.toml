# The one hand-edited build manifest: every upstream compiled into the wheel
# and every part of the one extension built from them. scripts/builder.py turns
# it into each build's ninja file, and every other script reads it rather than
# keeping its own list.
#
# [upstream.NAME], vendored under vendor/NAME/ at its own paths by `uv run scripts fetch`:
#   repo, ref, commit  the repository, the ref `fetch --latest` follows, and the pin
#   host               where `repo` lives, if not "github.com"
#   tree_sha256        one hash of everything vendored for it, patches applied,
#                      which `fetch` writes and `check` verifies
#   spdx, copyright    its license, and the notice when its LICENSE has none
#   keep               upstream paths to keep, its licenses at least. Everything
#                      else it has is deleted unless the build reaches it: scripts/vendor.py
#   license_from       a source whose leading comment is its only license text
#   patches            { "NAME.patch" = sha256 } our changes, applied in order:
#                      unified diffs in vendor/patches/, each starting
#                      `kind: fix` (a bug or UB upstream) or `kind: perf` and
#                      why, every hunk matching exactly; `fetch` writes the hashes
# and how it is built, all of it quietly (vendored warnings aren't ours to fix):
#   include            header directories; system headers unless `own`
#   system             a header of it as the sources include it (`Eigen/Core`):
#                      a build may take it from the system's copy instead
#                      (`-Csystem=NAME,...`), never with patches
#   system_directory   where distributions put that header, under a directory
#                      the compiler searches (`eigen3`), if not right there
#   distro             { DISTRIBUTION = package } each one's package of that copy
#   requires           upstreams whose headers and defines its sources compile
#                      with, which every part compiling it must list too
#   sources            globs of files compiled into a static library
#   defines            { NAME = why } compile definitions for it and its users
#   no_sanitize        { check = why } sanitizer checks off for its sources
#   own                our own work: no repo, never fetched or hashed
# vendor/ holds exactly these upstreams and vendor/patches/, nothing else.
#
# [part.NAME], a part of the one extension: src/NAME.cpp, whose bind_NAME adds
# its functions and classes to the flat module:
#   upstreams          what it compiles in
#   fuzz               libFuzzer harnesses fuzz/HARNESS.cpp built against it
#   seeds              a program fuzz/SEEDS.cpp writing seeds for harness NAME
#
# [extension], the one extension, the package `trimkit` itself:
#   budget             the most bytes it may be stripped in a wheel, about
#                      twice its size, to catch an unstripped build
#   upstreams          what every part compiles against
#
# [distribution.NAME], what `uv run scripts distro` writes packaging for:
#   images             { machine = image } where to build it, by the digest of that
#                      one platform's manifest
#   requires           what building and testing need, besides `distro` packages
#
# [toolchain], the compilers our own builds (`-Cstrict=true`) accept: inclusive
# [oldest, newest] major versions, the ones the gate and the release's wheels
# have passed with, so an untried toolchain stops a release instead of shipping.
# Anyone else building the sdist is held only to the oldest.

[toolchain]
# clang, with its lld, llvm-ar or llvm-lib and llvm-profdata of the same LLVM,
# which ThinLTO's bitcode and PGO's profiles need: the dev image's Debian 19,
# musllinux's 20, manylinux's 21 and the Windows runners' LLVM: x64's 20, arm64's 22
llvm = [19, 22]
# Xcode's clang on macOS, with Xcode's own linker, libtool and llvm-profdata
apple_clang = [16, 17]

