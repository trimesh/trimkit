spdx = "MIT"
# only the simplifier: it needs nothing else from the library
keep = ["LICENSE.md", "src/simplifier.cpp"]
sources = ["vendor/meshoptimizer/src/simplifier.cpp"]
include = ["vendor/meshoptimizer/src"]

# collision and distance between meshes: coal's BVH traversal and GJK/EPA,
# only what our binding reaches. The one Boost.Math constant and Boost.Assert
# macro it uses are shims of ours in src/config/coal, with the headers its
# CMake would generate
[upstream.coal]
repo = "coal-library/coal"
ref = "devel"
commit = "83cdaa6addd580c11dadd2299476e6f08aece2f4"
tree_sha256 = "c07397b6a43a369b730aa4c85b2bf044e3b9a525e19d9abca15cbdcd978c0ade"
spdx = "BSD-3-Clause"
# src/distance/triangle_triangle.cpp defines a ShapeShapeDistancer specialization no header is named after
keep = ["LICENSE", "src/distance/triangle_triangle.cpp"]
requires = ["eigen"]
sources = ["vendor/coal/src/**/*.cpp"]
no_sanitize = { vptr = "convex support dispatches by casting a ConvexBase to empty derived tag types (SmallConvex, LargeConvex): a downcast to a type the object isn't, undefined but benign on every ABI, as the tags add no members or virtuals" }
include = ["vendor/coal/include", "vendor/coal/src", "vendor/coal/include/coal/third_party", "src/config/coal"]

[upstream.coal.patches]
"coal-bvh-bvh-performance.patch" = "f32a0b89a130c98ccc6a457925ab99aa6215206fc02d1c019b4d743a5ae48da8"

# coal's linear algebra, header only: only the headers coal and our binding
# reach on some wheel target. MPL-2.0, which binds only its own files, kept
# unmodified and shipped as source in the sdist
[upstream.eigen]
host = "gitlab.com"
repo = "libeigen/eigen"
ref = "master"
commit = "f6db5ea201198eb747bd9e34f7a3d8dfc4da308e"
tree_sha256 = "32d85596bef0f51f6483911663f0eb8798c01289b1e9f94310f7cc2527140e13"
spdx = "MPL-2.0"
copyright = "Copyright the Eigen authors"
keep = ["COPYING.MPL2", "COPYING.APACHE", "COPYING.BSD"]
include = ["vendor/eigen"]
system = "Eigen/Core"
system_directory = "eigen3"
distro = { debian = "libeigen3-dev", fedora = "eigen3-devel" }

[upstream.eigen.defines]
EIGEN_MPL2_ONLY = "refuse to compile any part of Eigen under a license other than MPL-2.0"

# nanobind, compiled from these sources into the one extension
