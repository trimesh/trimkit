# Big-endian once a month, and only when main has moved since the last run:
# the Debian package built from the sources and its suite run on s390x under
# qemu, by the same `uv run scripts distro --run --machine s390x` that does it
# locally (which `check` leaves to packaging changes). An emulated suite takes
# hours, too long to hold every release for, so a release ships without it and
# this catches a byte-order bug within the month. No wheel ships for s390x, but
# every distribution that builds the sdist there gets what this tested.
# Actions are pinned to the commit of their release; `uv run scripts update`
# moves them.
name: big-endian

on:
  schedule:
    - cron: "17 6 1 * *" # the 1st of each month, 06:17 UTC
  workflow_dispatch: # by hand: always runs

permissions: {}

# one run at a time, never cancelled partway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  changed:
    name: anything new to test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # this workflow's last successful run
    outputs:
      test: ${{ steps.last.outputs.test }}
    steps:
      # main's head against the commit the last successful run tested (or
      # found nothing new at): the same commit is never tested twice
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          last=$(gh run list --repo "$REPOSITORY" --workflow big-endian.yml --branch main --status success \
            --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$EVENT" = workflow_dispatch ] || [ "$last" != "$HEAD" ]; then
            echo "test=true" >> "$GITHUB_OUTPUT"
          else
            echo "test=false" >> "$GITHUB_OUTPUT"
          fi

  s390x:
    name: big-endian (s390x, under qemu)
    needs: changed
    if: needs.changed.outputs.test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the emulator registered for s390x binaries, from an installer pinned
      # by digest as the action's own default isn't
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: s390x
          image: docker.io/tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv run scripts distro --run --machine s390x
