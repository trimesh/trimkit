# Publish `trimkit` to PyPI from every push to main: the sdist and one wheel
# per platform, each built and tested by the same `uv run scripts <command>`
# that runs locally, then uploaded as whatever version pyproject.toml names.
# PyPI refuses a version twice, so a push that doesn't bump it uploads
# nothing. A push to a release/ branch does everything but the upload: the only
# way to see macOS and Windows before main does. It lints rather than fuzzes:
# every linter (`lint`, then `static`) before the sdist, and abi3audit with the
# other wheel checks in every wheel job, and nothing publishes until the
# s390x job has built and tested the package big-endian. The sanitizers and
# fuzzers are `uv run scripts check`, the gate, run before pushing, and the
# distribution builds `uv run scripts distro --run` when packaging changes;
# fuzz.yml also fuzzes for longer once a week, when main has moved.
#
# PyPI trusted publisher (pypi.org/manage/account/publishing, "pending
# publisher" until the first upload creates the project): PyPI project
# `trimkit`, owner `trimesh`, repository `trimkit`, workflow `release.yml`,
# environment `pypi`. In GitHub, limit the `pypi` environment to `main`.
# Actions are pinned to the commit of their release; `uv run scripts update`
# moves them.
name: release

on:
  push:
    branches: [main, "release/**"]

permissions: {}

# one release at a time, never cancelled partway
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sdist:
    name: lint and sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # the fast checks, then those that need a build, then the sdist from
      # the tracked files, built and tested on its own: no sdist to publish
      # unless all of them pass
      - run: uv run scripts lint
      - run: uv run scripts static
      - run: uv run scripts sdist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: build/docker/sdist/*.tar.gz

  wheels:
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # a native crash in any process writes a minidump here (Windows Error
      # Reporting's LocalDumps), which the job uploads if it fails
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:RUNNER_TEMP crash-dumps
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key DumpFolder -PropertyType ExpandString -Value $dumps | Out-Null
          New-ItemProperty -Force $key DumpType -PropertyType DWord -Value 1 | Out-Null
          New-ItemProperty -Force $key DumpCount -PropertyType DWord -Value 50 | Out-Null
      # configured in pyproject.toml: one abi3 wheel per platform,
      # profile-guided, tested on every CPython from 3.12, and audited
      - run: uv run scripts wheel
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
      # a failed job's native crashes, with their C stacks: macOS writes a
      # report of every crash, Windows the minidumps above. The tests print
      # each Python's own stack (check/tests/conftest.py)
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crashes-${{ matrix.os }}
          path: |
            ~/Library/Logs/DiagnosticReports/
            ${{ runner.temp }}/crash-dumps/
          if-no-files-found: ignore

  # big-endian: the Debian package built from the sources and its suite run
  # on s390x under qemu, by the command that does it locally (which `check`
  # leaves to packaging changes, as an emulated suite takes most of an hour).
  # No wheel ships for it, but every distribution that builds the sdist there
  # gets what this tested
  s390x:
    name: big-endian (s390x, under qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read # check out the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the emulator registered for s390x binaries, from an installer pinned
      # by digest as the action's own default isn't
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: s390x
          image: docker.io/tonistiigi/binfmt:qemu-v10.0.4@sha256:8f58e6214f4cc9dc83ce8f5acad1ece508eb6b20e696a8c1e9f274481982c541
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv run scripts distro --run --machine s390x

  publish:
    name: publish to PyPI
    needs: [sdist, wheels, s390x]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/trimkit/
    permissions:
      id-token: write # PyPI trusted publishing exchanges this token to upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # a version PyPI already has is left as it is: the push didn't bump it
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
